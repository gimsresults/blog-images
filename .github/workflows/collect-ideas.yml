name: Collect topic ideas from Telegram

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths: ["scripts/collect_ideas.py", ".github/workflows/collect-ideas.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-ideas
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read new Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN secret not set yet"; exit 0; fi
          python3 scripts/collect_ideas.py

      - name: Save ideas
        run: |
          git config user.name "gims-ideas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ideas 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "New topic ideas"
          git pull --rebase
          git push
