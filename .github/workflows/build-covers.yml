name: Build blog covers

on:
  push:
    branches: [main]
    paths: ["covers/**", "scripts/**", "assets/**", ".github/workflows/build-covers.yml"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: build-covers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find new blog posts waiting for a cover
        run: python3 scripts/scan_blog.py

      - name: Check for covers to render
        id: todo
        run: |
          n=0
          for f in covers/*.json; do
            [ -e "$f" ] || continue
            s=$(basename "$f" .json)
            [ -e "images/$s.jpg" ] || n=$((n+1))
          done
          echo "Covers to render: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Get template, font and Pillow
        if: steps.todo.outputs.count != '0'
        run: |
          pip install pillow
          cp assets/template.png /tmp/template.png
          cd /tmp && npm pack @fontsource/barlow-condensed@5 --silent
          tar xzf /tmp/fontsource-barlow-condensed-*.tgz -C /tmp
          cp /tmp/package/files/barlow-condensed-latin-800-normal.woff /tmp/headline.woff

      - name: Render new covers
        if: steps.todo.outputs.count != '0'
        run: python3 scripts/make_cover.py /tmp/template.png /tmp/headline.woff

      - name: Commit images
        if: steps.todo.outputs.count != '0'
        run: |
          git config user.name "gims-cover-bot"
          git config user.email "actions@users.noreply.github.com"
          git add covers images
          git diff --cached --quiet && echo "No new covers" && exit 0
          git commit -m "Add blog cover images"
          git pull --rebase
          git push
