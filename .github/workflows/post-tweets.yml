name: Post tweets

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["tweets/queue/**", "scripts/post_tweet.py", ".github/workflows/post-tweets.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-tweets
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post next due tweet
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 scripts/post_tweet.py

      - name: Save log
        if: always()
        run: |
          git config user.name "gims-tweet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tweets/posted.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Tweet log"
          git pull --rebase
          git push
